# Found while build-verifying this task: on the currently-pinned ZMK
# revision, neither CONFIG_ZMK_BLE nor CONFIG_ZMK_USB actually get
# enabled by the nice_nano board's own defconfig
# (nice_nano_nrf52840_zmk_2_0_0_defconfig sets both =y, but they
# resolve to unset in the final .config) - reproduced identically with
# ZMK's own unmodified corne_left shield on this same board/revision,
# so it's an upstream HWMv2 board-migration rough edge, not something
# specific to ghkb. Set explicitly here rather than relying on the
# board default.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# ghkb has two independent JST-PH batteries (one per half). ZMK only
# reports the central (this, left) half's battery by default; enable
# fetching + proxying so the peripheral (right) half's battery is also
# reported to the host. Note: the host may receive two separate BLE
# Battery Service notifications for what looks like one HID device -
# OS support for displaying both is inconsistent, but the alternative
# (right battery invisible until it dies) is worse for this board.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
